<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Smooth Vietnamese Text to Speech</title>
<style>
body {
  background: linear-gradient(120deg,#00c6ff,#0072ff);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial;
  margin: 0;
}

.card {
  background: white;
  width: 420px;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
  text-align: center;
}

textarea {
  width: 100%;
  height: 150px;
  padding: 12px;
  border-radius: 10px;
  font-size: 16px;
  border: 1px solid #ccc;
  resize: none;
}

.buttons {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

button {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 17px;
  cursor: pointer;
}

.speak { background: #0072ff; color: white; }
.pause { background: #ffa500; color: white; }
.stop  { background: #ff3b3b; color: white; }

.speak:hover { background: #005ad1; }
.pause:hover { background: #cc8400; }
.stop:hover  { background: #cc2c2c; }
</style>
</head>

<body>

<div class="card">
  <h2>🎧 Smooth Vietnamese TTS</h2>

  <textarea id="text" placeholder="Nhập văn bản tiếng Việt..."></textarea>

  <div class="buttons">
    <button class="speak" onclick="speak()">▶ Speak</button>
    <button class="pause" onclick="pauseResume()">⏸ Pause / Resume</button>
    <button class="stop" onclick="stopSpeak()">⏹ Stop</button>
  </div>
</div>

<script>
let utterance;
let paused = false;

function speak() {
  const text = document.getElementById("text").value.trim();
  if (!text) return;

  speechSynthesis.cancel();

  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "vi-VN";
  utterance.rate = 0.95;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);
  paused = false;
}

function pauseResume() {
  if (!speechSynthesis.speaking) return;

  if (!paused) {
    speechSynthesis.pause();
    paused = true;
  } else {
    speechSynthesis.resume();
    paused = false;
  }
}

function stopSpeak() {
  speechSynthesis.cancel();
  paused = false;
}
</script>

</body>
</html>
